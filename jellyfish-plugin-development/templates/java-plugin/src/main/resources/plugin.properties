# Jellyfish 插件描述符（必须位于插件 jar 根目录，PF4J 按名查找）
#
# plugin.id 同时是注册表的 owner：插件卸载 / 停止时按它把本插件注册的能力一次收干净，
# 也是 jellyfish.json 里 plugins.enabled 与 plugins.configurations 用的名字。
# 不要含 "::"（那是插件与子身份的分隔符），会被直接拒。
plugin.id=my-plugin

# 入口类：必须实现 zcd.jellyfish.api.plugin.JellyfishPlugin、非抽象、
# 且提供公开无参构造器（PF4J 用插件类加载器实例化，走不了构造器注入）。
plugin.class=com.example.myplugin.MyPlugin

plugin.version=0.1.0
plugin.provider=com.example
plugin.description=一句话说明这个插件做什么

# 内核兼容约束：内核目前不声明系统版本，写 * 是显式声明「不限版本」。
# 写成非法 semver 表达式会被归一为 * 并记一条描述符错误 —— 表现是插件起不来。
plugin.requires=*

# 逗号分隔标签：仅用于诊断与展示（不参与任何授权判定）
jellyfish.tags=example
